name: graveshift

x-logging: &logging
  driver: journald
  options:
    tag: graveshift-{{.Name}}

x-game: &game
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  stop_grace_period: 16m
  environment:
    GRAVESHIFT_DRAIN_SECONDS: 900
  networks:
    - edge
  logging: *logging

services:
  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      GRAVESHIFT_DOMAIN: ${GRAVESHIFT_DOMAIN:?set GRAVESHIFT_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    logging: *logging

  blue:
    <<: *game
    image: ${BLUE_IMAGE:-graveshift-slot-unset}

  green:
    <<: *game
    image: ${GREEN_IMAGE:-graveshift-slot-unset}

networks:
  edge: {}

volumes:
  caddy-data: {}
  caddy-config: {}
