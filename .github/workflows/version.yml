name: Version

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions: {}

concurrency:
  group: version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Check version bump and changelog
        env:
          MANIFEST: packages/shared/package.json
        run: |
          jq '.pull_request | { title, labels: [.labels[].name] }' "$GITHUB_EVENT_PATH" \
            > "$RUNNER_TEMP/pull-request.json"
          node scripts/release/release.ts verify \
            --base-version "$(git show "origin/$GITHUB_BASE_REF:$MANIFEST" | jq -r .version)" \
            --pull-request "$RUNNER_TEMP/pull-request.json"
