name: Release

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          MANIFEST: packages/shared/package.json
        run: |
          publish() {
            if git rev-parse -q --verify "refs/tags/v$1" > /dev/null; then
              return
            fi
            node scripts/release/release.ts notes --version "$1" --notes "$RUNNER_TEMP/v$1.md"
            gh release create "v$1" --target "$2" --title "v$1" --notes-file "$RUNNER_TEMP/v$1.md"
          }
          publish "$(git show "$BEFORE:$MANIFEST" | jq -r .version)" "$BEFORE"
          publish "$(jq -r .version "$MANIFEST")" "$GITHUB_SHA"
